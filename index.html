/* ============================================================
   BROILER CYCLE — replaces the Excel batch workbook
   (feed formulas, feed stock, deaths day/night, medicine & charcoal,
    weekly weights and FCR, other costs, full batch cost summary)
   ============================================================ */
const BR = { id:null, tab:'summary', all:[], C:null };
const D8 = s => new Date(s + 'T00:00:00');
const dayOf = (start, d) => Math.round((D8(d) - D8(start)) / 864e5) + 1;
const sumBy = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const SUPCAT = { medication:'Medication', drug:'Drugs & vaccines', charcoal:'Charcoal / heating' };

/* every figure on the screen comes from this one function */
function calcBroiler(R) {
  const b = R.batch, init = Number(b.quantity_initial), start = b.acquired_on;
  const F = R.formulas.map(f => {
    const bagKg = Number(f.bag_kg), planKg = Number(f.plan_bags) * bagKg;
    const items = R.items.filter(i => i.formula_id === f.id).map(i => {
      const perKg = Number(i.unit_price) / Number(i.unit_kg), kg = Number(i.inclusion_kg_per_tonne) * planKg / 1000;
      return { ...i, perKg, perTonne: perKg * Number(i.inclusion_kg_per_tonne), kg, units: kg / Number(i.unit_kg), cost: kg * perKg };
    });
    const perTonne = sumBy(items, i => i.perTonne) + Number(f.milling_per_tonne);
    return { ...f, items, perTonne, perBag: perTonne * bagKg / 1000, incl: sumBy(items, i => i.inclusion_kg_per_tonne),
             planCost: sumBy(items, i => i.cost) + Number(f.milling_per_tonne) * planKg / 1000 };
  });
  const fById = {}; F.forEach(f => fById[f.id] = f);
  const bal = {};
  const feed = R.feed.map(r => {
    const f = fById[r.formula_id] || { name:'?', bag_kg:50 }, short = Math.max(Number(r.bags_invoiced) - Number(r.bags_received), 0);
    bal[r.formula_id] = (bal[r.formula_id] || 0) + Number(r.bags_received) - Number(r.bags_used);
    return { ...r, fname:f.name, day:dayOf(start, r.log_date), short, shortVal:short * Number(r.price_per_bag),
             kg:Number(r.bags_used) * Number(f.bag_kg), cost:Number(r.bags_used) * Number(r.price_per_bag),
             stock:bal[r.formula_id], variance:r.physical_count == null ? null : Number(r.physical_count) - bal[r.formula_id] };
  });
  const feedBy = F.map(f => { const rows = feed.filter(r => r.formula_id === f.id);
    return { f, rec:sumBy(rows, r => r.bags_received), inv:sumBy(rows, r => r.bags_invoiced), used:sumBy(rows, r => r.bags_used), kg:sumBy(rows, r => r.kg),
             cost:sumBy(rows, r => r.cost), short:sumBy(rows, r => r.short), shortVal:sumBy(rows, r => r.shortVal),
             stock:sumBy(rows, r => r.bags_received) - sumBy(rows, r => r.bags_used) }; });
  const mort = R.events.filter(e => e.event_type === 'mortality'), cull = sumBy(R.events.filter(e => e.event_type === 'cull'), e => e.quantity);
  const sold = sumBy(R.sales, s => s.quantity);
  const days = {}; mort.forEach(e => { const x = days[e.event_date] = days[e.event_date] || { date:e.event_date, day:0, night:0 };
    if (e.shift === 'night') x.night += Number(e.quantity); else x.day += Number(e.quantity); });
  let cum = 0;
  const deaths = Object.values(days).sort((p, q) => p.date.localeCompare(q.date)).map(x => { cum += x.day + x.night;
    return { ...x, n:dayOf(start, x.date), total:x.day + x.night, cum, alive:init - cum, pct:cum / init * 100 }; });
  const dead = cum, nightDead = sumBy(mort.filter(e => e.shift === 'night'), e => e.quantity), alive = init - dead - cull - sold;
  const sbal = {};
  const supplies = R.supplies.map(r => { const k = r.category + '|' + r.item; sbal[k] = (sbal[k] || 0) + Number(r.qty_received) - Number(r.qty_used);
    return { ...r, day:dayOf(start, r.log_date), cost:Number(r.qty_used) * Number(r.unit_price), stock:sbal[k] }; });
  const goneBy = d => sumBy(R.events.filter(e => (e.event_type === 'mortality' || e.event_type === 'cull') && e.event_date <= d), e => e.quantity);
  const weights = R.weights.map(w => { const n = dayOf(start, w.sample_date), alive_ = init - goneBy(w.sample_date);
    const feedKg = sumBy(feed.filter(r => r.log_date <= w.sample_date), r => r.kg), live = alive_ * Number(w.avg_weight_kg);
    const t = R.targets.slice().sort((p, q) => Math.abs(p.day - n) - Math.abs(q.day - n))[0] || {};
    return { ...w, n, alive:alive_, live, feedKg, fcr:live ? feedKg / live : null, tw:t.target_weight_kg, tf:t.target_fcr,
             eff:feedKg ? live / feedKg * 100 : null }; });
  const other = sumBy(R.costs, c => c.total), cat = c => sumBy(supplies.filter(s => s.category === c), s => s.cost);
  const cost = { chicks:Number(b.acquisition_cost), feed:sumBy(feed, r => r.cost), short:sumBy(feed, r => r.shortVal),
                 medication:cat('medication'), drug:cat('drug'), charcoal:cat('charcoal'), other };
  cost.total = Object.values(cost).reduce((a, v) => a + v, 0);
  const expPrice = Number(b.expected_price) || 0, expKg = Number(b.expected_weight_kg) || 0;
  return { b, F, feed, feedBy, deaths, dead, nightDead, cull, sold, alive, supplies, weights, cost, init,
           feedKg:sumBy(feed, r => r.kg), age:Math.max(dayOf(start, today()), 1),
           costRows:R.costs, expRev:alive * expPrice, expProfit:alive * expPrice - cost.total, perBird:alive ? cost.total / alive : 0,
           perKg:alive && expKg ? cost.total / (alive * expKg) : 0, lastW:weights.filter(w => w.fcr).slice(-1)[0] };
}

async function loadBroiler(id) {
  const q = (t, o) => sb.from(t).select('*').eq('batch_id', id).order(o).order('id');
  const r = await Promise.all([
    sb.from('poultry_batches').select('*, loc:locations(name)').eq('id', id).single(), q('poultry_events', 'event_date'), q('poultry_feed_log', 'log_date'),
    q('poultry_supply_log', 'log_date'), q('poultry_weights', 'sample_date'), q('poultry_costs', 'cost_date'),
    sb.from('feed_formulas').select('*').order('id'), sb.from('feed_formula_items').select('*').order('id'),
    sb.from('poultry_targets').select('*').order('day'), sb.from('sale_items').select('quantity,line_total').eq('batch_id', id)]);
  const bad = r.find(x => x.error); if (bad) throw bad.error;
  const [b, events, feed, supplies, weights, costs, formulas, items, targets, sales] = r.map(x => x.data);
  return calcBroiler({ batch:b, events, feed, supplies, weights, costs, formulas, items, targets, sales });
}

async function renderBroiler() {
  $('#main').innerHTML = '<div class="bar"><h2>Broiler cycle</h2><span id="brSel"></span></div><div id="brBody"><p class="muted">Loading…</p></div>';
  const { data, error } = await sb.from('poultry_batches').select('id,batch_code,status').eq('poultry_type', 'broiler').order('acquired_on', { ascending:false });
  if (error) return $('#brBody').innerHTML = `<p class="neg">${esc(error.message)}</p>`;
  BR.all = data;
  const newBtn = can('poultry_batches') ? '<button class="btn small" id="brNew">+ New batch</button>' : '';
  if (!data.length) {
    $('#brBody').innerHTML = `<p class="muted">No broiler batches yet. Create one to start the cycle. ${newBtn}</p>`;
    if ($('#brNew')) $('#brNew').onclick = () => newBatch(data);
    return;
  }
  if (!data.some(b => b.id === BR.id)) BR.id = (data.find(b => b.status === 'active') || data[0]).id;
  $('#brSel').innerHTML = `<select id="brPick" style="max-width:210px">${data.map(b => `<option value="${b.id}" ${b.id === BR.id ? 'selected' : ''}>${esc(b.batch_code)}${b.status === 'closed' ? ' (closed)' : ''}</option>`).join('')}</select> ${newBtn}`;
  $('#brPick').onchange = e => { BR.id = Number(e.target.value); drawBroiler(); };
  if ($('#brNew')) $('#brNew').onclick = () => newBatch(data);
  drawBroiler();
}

/* ---- small helpers ---- */
const kp = (l, v, c) => `<div class="kpi"><div class="l">${l}</div><div class="v ${c || ''}">${v}</div></div>`;
const tbl = (head, rows, empty) => `<div class="tw"><table><thead><tr>${head.map(h => `<th${h[1] ? ' class="n"' : ''}>${h[0]}</th>`).join('')}</tr></thead><tbody>${
  rows.map(r => `<tr>${r.map((c, i) => `<td${head[i] && head[i][1] ? ' class="n"' : ''}>${c ?? ''}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="muted">${empty || 'Nothing recorded yet.'}</td></tr>`}</tbody></table></div>`;
const delBtn = (t, id) => can(t) ? `<button class="btn small ghost" data-del="${t}:${id}" title="Delete">×</button>` : '';
const addBtn = (t, key, label) => can(t) ? `<button class="btn small" data-add="${key}">${label}</button>` : '';
const fmt1 = v => v == null ? '–' : num(Math.round(v * 100) / 100);

function formModal(title, fields, save) {
  openModal(`<h3>${esc(title)}</h3><form id="fm"><div class="grid2">${fields.map(f => `<label>${esc(f.l)}${f.t === 'select'
    ? `<select id="f_${f.k}">${f.o.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`
    : `<input id="f_${f.k}" type="${f.t || 'text'}" ${f.t === 'number' ? 'step="any" min="0"' : ''} value="${esc(f.v ?? '')}" ${f.req ? 'required' : ''} ${f.dl ? `list="dl_${f.k}"` : ''}>${f.dl ? `<datalist id="dl_${f.k}">${f.dl.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`}</label>`).join('')}</div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="fmSave">Save</button></div></form>`);
  fields.filter(f => f.t === 'select' && f.v != null).forEach(f => $('#f_' + f.k).value = f.v);
  $('#fm').onsubmit = async e => {
    e.preventDefault();
    const v = {}; fields.forEach(f => { const x = $('#f_' + f.k).value.trim(); v[f.k] = f.t === 'number' ? (x === '' ? null : Number(x)) : (x || null); });
    $('#fmSave').disabled = true;
    const err = await save(v);
    if (err) { $('#fmSave').disabled = false; return toast(err.message || String(err), true); }
    closeModal(); toast('Saved'); drawBroiler();
  };

async function drawBroiler() {
  try { BR.C = await loadBroiler(BR.id); } catch (e) { return $('#brBody').innerHTML = `<p class="neg">${esc(e.message)}<br>Have you run broiler_migration.sql in Supabase?</p>`; }
  const TABS = [['formulas','Feed formulation','#c8661a'],['setup','Setup & Prices','#1f4f3f'],['feed','Feed Log','#5b9e45'],['medication','Medication Log','#5b9e45'],['deaths','Mortality Log','#5b9e45'],['charcoal','Charcoal Log','#5b9e45'],['drug','Drugs Log','#5b9e45'],['weights','Weights & FCR','#5b9e45'],['summary','Batch Summary','#c00000']];
  $('#brBody').innerHTML = `<div class="row-actions" style="margin-bottom:10px">${TABS.map(t => `<button class="btn small" data-tab="${t[0]}" style="background:${t[2]};color:#fff;border:0;${BR.tab === t[0] ? 'box-shadow:0 3px 0 #000;font-weight:700' : 'opacity:.6'}">${t[1]}</button>`).join('')}
    ${can('poultry_batches') ? '<button class="btn small ghost" data-add="settings">⚙ Batch settings</button>' : ''}</div><div id="brTab">${BT[BR.tab](BR.C)}</div>`;
  $('#brBody').querySelectorAll('[data-tab]').forEach(x => x.onclick = () => { BR.tab = x.dataset.tab; drawBroiler(); });
  $('#brBody').querySelectorAll('[data-add]').forEach(x => x.onclick = () => { const [k, a] = x.dataset.add.split(':'); ADD[k](BR.C, a); });
  $('#brBody').querySelectorAll('[data-del]').forEach(x => x.onclick = async () => {
    const [t, id] = x.dataset.del.split(':'); if (!confirm('Delete this entry?')) return;
    const { error } = t === 'deaths' ? await sb.from('poultry_events').delete().eq('batch_id', BR.id).eq('event_type', 'mortality').eq('event_date', id)
                                      : await sb.from(t).delete().eq('id', id);
    if (error) return toast(error.message, true);
    toast('Deleted'); drawBroiler(); });
}

function usedTable(C) {
  const rows = [];
  C.feedBy.forEach(x => rows.push(['Feed', esc(x.f.name), '<b>' + num(x.used) + '</b>', 'bags (' + num(x.kg) + ' kg)', money(x.cost)]));
  const g = {};
  C.supplies.forEach(s => { const k = s.category + '|' + s.item, x = g[k] = g[k] || { cat:s.category, item:s.item, unit:s.unit, used:0, cost:0 }; x.used += Number(s.qty_used); x.cost += s.cost; });
  Object.values(g).forEach(x => rows.push([SUPCAT[x.cat], esc(x.item), '<b>' + num(x.used) + '</b>', esc(x.unit || ''), money(x.cost)]));
  const fuel = C.costRows.filter(r => /diesel|fuel|petrol|paraffin/i.test(r.item));
  rows.push(['Fuel', 'Diesel and fuel trips (from Setup & Prices)', '<b>' + num(sumBy(fuel.filter(r => /diesel/i.test(r.item)), r => r.quantity)) + '</b>', 'litres of diesel', money(sumBy(fuel, r => r.total))]);
  const rest = C.costRows.filter(r => !fuel.includes(r));
  rows.push(['Other', 'Labour, electricity, curtains, transport…', '', '', money(sumBy(rest, r => r.total))]);
  return tbl([['Type'], ['Item'], ['Used', 1], ['Unit'], ['Cost', 1]], rows);
}

  async 'editformula'(C, id) { const f = C.F.find(x => String(x.id) === String(id));
    formModal('Edit ' + f.name, [{ k:'phase', l:'Phase', v:f.phase }, { k:'bag', l:'Bag weight (kg)', t:'number', v:f.bag_kg }, { k:'plan', l:'Bags to produce per cycle', t:'number', v:f.plan_bags }, { k:'mill', l:'Milling cost per tonne', t:'number', v:f.milling_per_tonne }],
      v => sb.from('feed_formulas').update({ phase:v.phase, bag_kg:v.bag || 50, plan_bags:v.plan || 0, milling_per_tonne:v.mill || 0 }).eq('id', f.id).then(r => r.error)); },
  async 'ingredient'(C, id) { formModal('Add ingredient', [{ k:'ing', l:'Ingredient', req:1, dl:[...new Set(C.F.flatMap(f => f.items.map(i => i.ingredient)))] }, { k:'inc', l:'Inclusion (kg per tonne of feed)', t:'number', req:1 },
      { k:'ul', l:'Purchase unit (50kg bag…)' }, { k:'ukg', l:'Unit size (kg)', t:'number', v:50 }, { k:'up', l:'Price per unit (USD)', t:'number', req:1 }],
      v => v.inc > 0 ? brIns('feed_formula_items', { formula_id:Number(id), ingredient:v.ing, inclusion_kg_per_tonne:v.inc, unit_label:v.ul, unit_kg:v.ukg || 1, unit_price:v.up }) : { message:'Enter the inclusion' }); }
};

/* start the login-page network */
startNetwork($('#netLogin'), { icons:9, density:12000 });
</script>
