<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubatana KweVarimi Farm</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#2f6b3a; --green-d:#234f2b; --bg:#f4f6f3; --card:#fff; --line:#dfe5dc;
    --text:#1d2a1f; --muted:#6b7a6d; --red:#b3261e; --amber:#b26a00;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  button,input,select,textarea{font:inherit}
  .btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
  .btn:hover{background:var(--green-d)}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn.danger{background:var(--red)}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  label input,label select,label textarea{margin-top:4px;color:var(--text);font-size:15px}
  label.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
  label.chk input{width:auto;margin:0}

  /* login */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;z-index:60;padding:16px;
    background:radial-gradient(circle at 20% 15%,#3f8c50 0%,#1f4f2a 55%,#102f1a 100%)}
  #login canvas{position:absolute;inset:0;width:100%;height:100%}
  #login .wrap{position:relative;width:100%;max-width:400px;pointer-events:none}
  #login .hero{text-align:center;color:#fff;margin-bottom:18px}
  #login .hero .logo{font-size:46px;line-height:1;animation:bob 3s ease-in-out infinite}
  #login .hero h1{margin:8px 0 6px;font-size:26px;line-height:1.15}
  #login .hero p{margin:0;color:#cfe6d3;font-size:14px}
  #login .box{background:rgba(255,255,255,.96);border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35);pointer-events:auto}
  #login .box h3{margin:0 0 14px}
  #login .row{display:flex;gap:8px;margin-top:6px}
  #login .row .btn{flex:1}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media(prefers-reduced-motion:reduce){#login .hero .logo{animation:none}}
  .hero-card{position:relative;height:130px;border-radius:14px;overflow:hidden;margin-bottom:16px;color:#fff;
    background:linear-gradient(120deg,#2f6b3a,#1d4a27)}
  .hero-card canvas{position:absolute;inset:0;width:100%;height:100%}
  .hero-card .hc{position:relative;padding:22px 24px;pointer-events:none}
  .hero-card .hc h2{margin:0 0 4px;font-size:22px}
  .hero-card .hc p{margin:0;color:#cfe6d3;font-size:14px}

  /* shell */
  #app{display:none;min-height:100vh}
  #side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--green-d);color:#fff;padding:16px 10px;display:flex;flex-direction:column;overflow:auto;z-index:20}
  #side h2{margin:4px 10px 16px;font-size:16px;line-height:1.25}
  #side a{display:block;padding:9px 12px;border-radius:8px;color:#dfeee1;text-decoration:none;cursor:pointer;margin-bottom:2px}
  #side a:hover{background:rgba(255,255,255,.1)}
  #side a.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
  #side .soon{opacity:.4;cursor:default}
  #side .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9fc3a5;margin:14px 12px 6px}
  #side .me{margin-top:auto;padding:12px;font-size:13px;color:#cfe3d2;border-top:1px solid rgba(255,255,255,.15)}
  #side .me button{margin-top:8px;width:100%}
  #top{display:none;position:sticky;top:0;background:var(--green-d);color:#fff;padding:10px 14px;z-index:10;align-items:center;gap:12px}
  #top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px}
  #main{margin-left:220px;padding:22px;max-width:1200px}
  @media(max-width:800px){
    #side{transform:translateX(-100%);transition:.2s}
    #side.open{transform:none}
    #main{margin-left:0;padding:14px}
    #top{display:flex}
  }

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .bar h2{margin:0;flex:1;min-width:140px}
  .bar input{max-width:240px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:21px;font-weight:700;margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  table{width:100%;border-collapse:collapse;background:var(--card)}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer} tr.click:hover{background:#f0f5ee}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e6efe4;color:var(--green-d)}
  .tag.warn{background:#fdecc8;color:var(--amber)} .tag.bad{background:#f9dedc;color:var(--red)}
  .barfill{height:8px;background:var(--green);border-radius:4px;min-width:2px}
  .muted{color:var(--muted)}

  /* livestock */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center;transition:.15s}
  .tile:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .tile.on{border-color:var(--green);background:#eef5ec}
  .tile .e{font-size:34px;line-height:1}
  .tile .c{font-size:22px;font-weight:700;margin-top:4px}
  .tile .s{font-size:12px;color:var(--muted);text-transform:capitalize}
  .prof-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .prof-head .big{font-size:48px;line-height:1}
  .prof-head h3{margin:0 0 2px}
  .timeline{border-left:2px solid var(--line);margin-left:14px;padding-left:18px}
  .tl{position:relative;margin-bottom:12px}
  .tl .ic{position:absolute;left:-32px;top:0;background:#fff;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .tag.sold{background:#fdecc8;color:var(--amber)}

  /* modal */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
  #modal{background:#fff;border-radius:14px;width:100%;max-width:720px;padding:20px}
  #modal h3{margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .item-row{display:grid;grid-template-columns:2fr .8fr .9fr .8fr .9fr auto;gap:6px;align-items:end;margin-bottom:6px}
  .item-row label{margin:0;font-size:11px}
  @media(min-width:601px){.item-row.p4{grid-template-columns:2.4fr 1fr 1fr auto}}
  @media(max-width:600px){.item-row{grid-template-columns:1fr 1fr;border-bottom:1px dashed var(--line);padding-bottom:8px}}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
  #toast.err{background:var(--red)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <canvas id="netLogin"></canvas>
  <div class="wrap">
    <div class="hero">
      <div class="logo">🌾</div>
      <h1>Kubatana KweVarimi Farm</h1>
      <p>Livestock · Poultry · Milk · Meat · Eggs, all connected in one place</p>
    </div>
    <div class="box">
  <h3>Sign in</h3>
  <form id="loginForm">
    <label>Email<input type="email" id="lEmail" required autocomplete="username"></label>
    <label>Password<input type="password" id="lPass" required minlength="6" autocomplete="current-password"></label>
    <div class="row">
      <button class="btn" type="submit">Sign in</button>
      <button class="btn ghost" type="button" id="signupBtn">Create account</button>
    </div>
  </form>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="top"><button id="menuBtn">Menu</button><strong>Kubatana KweVarimi Farm</strong></div>
  <nav id="side"></nav>
  <main id="main"></main>
</div>

<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   1. CONFIG - paste your values from Supabase:
      Project Settings > API > Project URL and anon public key
   ============================================================ */
const SUPABASE_URL = 'https://zguehiwosvbmwgglvdsc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpndWVoaXdvc3ZibXdnZ2x2ZHNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjU3NTIsImV4cCI6MjEwNjcwMTc1Mn0.EJqCu0koHX2Sjw35lxP1uc3UrPToqEO4wX_IWrDxAlA';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   2. HELPERS
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(Number(n) || 0);
const num = n => new Intl.NumberFormat('en-US', {maximumFractionDigits:2}).format(Number(n) || 0);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ') : '';
const today = () => new Date().toISOString().slice(0, 10);
const LINES = ['livestock','meat','milk','poultry','eggs','other'];
const METHODS = ['cash','bank','mobile_money','other'];
const state = { user:null, profile:null };

function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = isErr ? 'err' : '';
  t.style.display = 'block'; clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', isErr ? 6000 : 2500);
}
function openModal(html) { $('#modal').innerHTML = html; $('#overlay').style.display = 'flex'; }
function closeModal() { $('#overlay').style.display = 'none'; $('#modal').innerHTML = ''; }
$('#overlay').addEventListener('mousedown', e => { if (e.target.id === 'overlay') closeModal(); });

/* which roles may write to which tables (the database enforces this too) */
const WRITE = {
  locations:['admin','manager'], products:['admin','manager'],
  customers:['admin','manager','accountant'], suppliers:['admin','manager','accountant'],
  sales:['admin','manager','accountant'], payments:['admin','manager','accountant'],
  animals:['admin','manager','worker'], animal_events:['admin','manager','worker'],
  purchases:['admin','manager','accountant'], expenses:['admin','manager','accountant'],
  poultry_batches:['admin','manager','worker'], poultry_events:['admin','manager','worker'],
  feed_formulas:['admin','manager'], feed_formula_items:['admin','manager'], poultry_feed_log:['admin','manager','worker'],
  poultry_supply_log:['admin','manager','worker'], poultry_weights:['admin','manager','worker'], poultry_costs:['admin','manager','accountant'],
  production_records:['admin','manager','worker'], stock_movements:['admin','manager','worker','accountant']
};
const can = t => !!(WRITE[t] && state.profile && WRITE[t].includes(state.profile.role));

/* ============================================================
   3. AUTH
   ============================================================ */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email:$('#lEmail').value.trim(), password:$('#lPass').value });
  if (error) toast(error.message, true);
});
$('#signupBtn').addEventListener('click', async () => {
  const email = $('#lEmail').value.trim(), password = $('#lPass').value;
  if (!email || password.length < 6) return toast('Enter an email and a password of 6+ characters', true);
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return toast(error.message, true);
  if (!data.session) toast('Account created. Check your email to confirm, then sign in.');
});

async function enter(user) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !data || !data.active) {
    toast('Your account is not active yet. Ask an administrator.', true);
    await sb.auth.signOut(); return;
  }
  state.user = user; state.profile = data;
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  renderNav(); go(location.hash.slice(1) || 'dashboard');
}
function showLogin() {
  state.user = null; state.profile = null;
  $('#app').style.display = 'none'; $('#login').style.display = 'flex';
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') showLogin();
  if (ev === 'SIGNED_IN' && session && !state.user) enter(session.user);
});
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if (session) enter(session.user);
})();

/* ============================================================
   4. NAVIGATION
   ============================================================ */
const PAGES = {
  dashboard: { title:'Dashboard', render: renderDashboard },
  livestock: { title:'Livestock', render: renderLivestock },
  poultry:   { title:'Poultry',   render: renderPoultry },
  broiler:   { title:'Broiler cycle', render: renderBroiler },
  production:{ title:'Production',render: renderProduction },
  stock:     { title:'Stock',     render: renderStock },
  sales:     { title:'Sales',     render: renderSales },
  purchases: { title:'Purchases', render: renderPurchases },
  expenses:  { title:'Expenses',  render: renderExpenses },
  products:  { title:'Products',  render: () => renderMaster(CFG.products) },
  customers: { title:'Customers', render: () => renderMaster(CFG.customers) },
  suppliers: { title:'Suppliers', render: () => renderMaster(CFG.suppliers) },
  locations: { title:'Locations', render: () => renderMaster(CFG.locations) },
  users:     { title:'Users',     render: renderUsers }
};

function renderNav() {
  const link = k => `<a data-p="${k}">${PAGES[k].title}</a>`;
  $('#side').innerHTML = `
    <h2>🌾 Kubatana KweVarimi Farm</h2>
    ${link('dashboard')}
    <div class="sec">Farm</div>${link('livestock')}${link('poultry')}${link('broiler')}${link('production')}${link('stock')}
    <div class="sec">Money</div>${link('sales')}${link('purchases')}${link('expenses')}
    <div class="sec">Setup</div>${link('products')}${link('customers')}${link('suppliers')}${link('locations')}
    ${state.profile.role === 'admin' ? `<div class="sec">Admin</div>${link('users')}` : ''}
    <div class="me">${esc(state.profile.full_name || state.user.email)}<br><span class="tag">${esc(state.profile.role)}</span>
      <button class="btn small ghost" id="logout" style="color:#fff;border-color:#fff">Sign out</button></div>`;
  $('#side').querySelectorAll('a[data-p]').forEach(a => a.onclick = () => go(a.dataset.p));
  $('#logout').onclick = () => sb.auth.signOut();
}
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');

function go(page) {
  if (!PAGES[page]) page = 'dashboard';
  if (page === 'users' && state.profile.role !== 'admin') page = 'dashboard';
  location.hash = page;
  $('#side').classList.remove('open');
  $('#side').querySelectorAll('a[data-p]').forEach(a => a.classList.toggle('active', a.dataset.p === page));
  $('#main').innerHTML = '<p class="muted">Loading…</p>';
  PAGES[page].render();
}

/* ============================================================
   5. MASTER DATA PAGES (products, customers, suppliers, locations)
   ============================================================ */
const CFG = {
  products: { table:'products', title:'Products', one:'Product',
    columns:[['name','Name'],['business_line','Business line',cap],['category','Category'],['unit','Unit'],
             ['selling_price','Price',v => v == null ? '' : money(v)],['track_stock','Stock?',v => v ? 'Yes' : ''],
             ['active','Status',v => v ? 'Active' : 'Inactive']],
    fields:[{key:'name',label:'Product name',required:true},
            {key:'business_line',label:'Business line',type:'select',options:LINES},
            {key:'category',label:'Category (e.g. Feed, Meat, Dairy)'},
            {key:'unit',label:'Unit (kg, litre, animal, tray, bird...)',required:true},
            {key:'selling_price',label:'Selling price (USD)',type:'number'},
            {key:'reorder_level',label:'Reorder level',type:'number'},
            {key:'track_stock',label:'Track stock for this product',type:'checkbox'},
            {key:'active',label:'Active',type:'checkbox',default:true}] },
  customers: { table:'customers', title:'Customers', one:'Customer',
    columns:[['name','Name'],['phone','Phone'],['customer_type','Type'],['credit_terms_days','Credit days'],['active','Status',v => v ? 'Active' : 'Inactive']],
    fields:[{key:'name',label:'Name',required:true},{key:'phone',label:'Phone'},{key:'email',label:'Email'},
            {key:'address',label:'Address'},{key:'customer_type',label:'Type (retail, butchery, restaurant...)'},
            {key:'credit_terms_days',label:'Credit terms (days)',type:'number',default:0},
            {key:'active',label:'Active',type:'checkbox',default:true}] },
  suppliers: { table:'suppliers', title:'Suppliers', one:'Supplier',
    columns:[['name','Name'],['phone','Phone'],['category','Category'],['payment_terms_days','Payment days'],['active','Status',v => v ? 'Active' : 'Inactive']],
    fields:[{key:'name',label:'Name',required:true},{key:'phone',label:'Phone'},{key:'email',label:'Email'},
            {key:'address',label:'Address'},{key:'category',label:'Category (feed, vet, equipment...)'},
            {key:'payment_terms_days',label:'Payment terms (days)',type:'number',default:0},
            {key:'active',label:'Active',type:'checkbox',default:true}] },
  locations: { table:'locations', title:'Locations', one:'Location',
    columns:[['name','Name'],['kind','Kind'],['active','Status',v => v ? 'Active' : 'Inactive']],
    fields:[{key:'name',label:'Name (e.g. Paddock A)',required:true},{key:'kind',label:'Kind (paddock, kraal, shed, dairy...)'},
            {key:'active',label:'Active',type:'checkbox',default:true}] }
};

async function renderMaster(cfg) {
  $('#main').innerHTML = `<div class="bar"><h2>${cfg.title}</h2><input id="q" placeholder="Search…">
    ${can(cfg.table) ? `<button class="btn" id="addBtn">+ Add ${cfg.one}</button>` : ''}</div><div id="tbl"></div>`;
  const { data, error } = await sb.from(cfg.table).select('*').order('name').limit(1000);
  if (error) return $('#tbl').innerHTML = `<p class="neg">${esc(error.message)}</p>`;
  const draw = () => {
    const q = $('#q').value.toLowerCase();
    const rows = data.filter(r => !q || String(r.name).toLowerCase().includes(q));
    $('#tbl').innerHTML = `<div class="tw"><table><thead><tr>${cfg.columns.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${can(cfg.table) ? 'click' : ''}" data-i="${i}">${cfg.columns.map(c => `<td>${esc(c[2] ? c[2](r[c[0]]) : r[c[0]])}</td>`).join('')}</tr>`).join('')
        || `<tr><td colspan="${cfg.columns.length}" class="muted">Nothing here yet.</td></tr>`}</tbody></table></div>`;
    $('#tbl').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openForm(cfg, rows[tr.dataset.i]));
  };
  $('#q').oninput = draw; draw();
  if ($('#addBtn')) $('#addBtn').onclick = () => openForm(cfg, null);
}

function fieldHtml(f, val) {
  const id = 'f_' + f.key;
  if (f.type === 'select')
    return `<label>${f.label}<select id="${id}">${f.options.map(o => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(cap(o))}</option>`).join('')}</select></label>`;
  if (f.type === 'checkbox')
    return `<label class="chk"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${f.label}</label>`;
  return `<label>${f.label}<input id="${id}" type="${f.type === 'number' ? 'number' : 'text'}" ${f.type === 'number' ? 'step="0.01" min="0"' : ''} value="${esc(val ?? '')}" ${f.required ? 'required' : ''}></label>`;
}

function openForm(cfg, row) {
  openModal(`<h3>${row ? 'Edit' : 'Add'} ${cfg.one}</h3><form id="mf"><div class="grid2">
    ${cfg.fields.map(f => fieldHtml(f, row ? row[f.key] : f.default)).join('')}</div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const rec = {};
    cfg.fields.forEach(f => {
      const el = $('#f_' + f.key);
      if (f.type === 'checkbox') rec[f.key] = el.checked;
      else if (f.type === 'number') rec[f.key] = el.value === '' ? null : Number(el.value);
      else rec[f.key] = el.value.trim() === '' ? null : el.value.trim();
    });
    const q = row ? sb.from(cfg.table).update(rec).eq('id', row.id) : sb.from(cfg.table).insert(rec);
    const { error } = await q;
    if (error) return toast(error.message, true);
    closeModal(); toast('Saved'); renderMaster(cfg);
  };
}

/* ============================================================
   6. SALES
   ============================================================ */
async function renderSales() {
  $('#main').innerHTML = `<div class="bar"><h2>Sales</h2><input id="q" placeholder="Search customer…">
    <select id="flt" style="max-width:170px"><option value="">All sales</option><option value="owing">Only unpaid / part-paid</option></select>
    ${can('sales') ? '<button class="btn" id="newSale">+ New sale</button>' : ''}</div><div id="tbl"></div>`;

async function saleDetail(id) {
  const { data:s, error } = await sb.from('sales')
    .select('*, customers(name), sale_items(*, products(name, unit)), payments(*)').eq('id', id).single();
  if (error) return toast(error.message, true);
  const total = s.sale_items.reduce((a, i) => a + Number(i.line_total), 0);
  const paid = s.payments.reduce((a, p) => a + Number(p.amount), 0);
  const bal = total - paid;
  openModal(`<h3>Sale #${s.id}</h3>
    <p class="muted">${esc(s.sale_date)} · ${esc(s.customers?.name || 'Walk-in')}${s.reference ? ' · Ref ' + esc(s.reference) : ''}${s.notes ? '<br>' + esc(s.notes) : ''}</p>
    <div class="tw"><table><thead><tr><th>Product</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Discount</th><th class="n">Total</th></tr></thead><tbody>
      ${s.sale_items.map(i => `<tr><td>${esc(i.products?.name)}</td><td class="n">${num(i.quantity)} ${esc(i.products?.unit)}</td><td class="n">${money(i.unit_price)}</td><td class="n">${money(i.discount)}</td><td class="n">${money(i.line_total)}</td></tr>`).join('')}
      <tr><td colspan="4" class="n"><b>Total</b></td><td class="n"><b>${money(total)}</b></td></tr></tbody></table></div>
    <h4>Payments</h4>
    ${s.payments.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Method</th><th>Ref</th><th class="n">Amount</th></tr></thead><tbody>
      ${s.payments.map(p => `<tr><td>${esc(p.payment_date)}</td><td>${esc(cap(p.method))}</td><td>${esc(p.reference || '')}</td><td class="n">${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No payments yet.</p>'}
    <p><b>Balance owing: <span class="${bal > 0.005 ? 'neg' : 'pos'}">${money(bal)}</span></b></p>
    ${can('payments') && bal > 0.005 ? `<form id="payF" class="grid2" style="align-items:end">
      <label>Amount received<input type="number" id="pAmt" step="0.01" min="0.01" max="${bal.toFixed(2)}" value="${bal.toFixed(2)}" required></label>
      <label>Method<select id="pMeth">${METHODS.map(m => `<option value="${m}">${cap(m)}</option>`).join('')}</select></label>
      <label>Reference<input id="pRef"></label><div><button class="btn">Record payment</button></div></form>` : ''}
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  if ($('#payF')) $('#payF').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('payments').insert({ direction:'in', sale_id:s.id, amount:Number($('#pAmt').value),
      method:$('#pMeth').value, reference:$('#pRef').value.trim() || null });
    if (error) return toast(error.message, true);
    toast('Payment recorded'); saleDetail(s.id);
    if (location.hash === '#sales') renderSales(); else if (location.hash === '#dashboard') renderDashboard();
  };
}

async function newSale() {
  const [cu, pr, sk] = await Promise.all([
    sb.from('customers').select('id,name').eq('active', true).order('name'),
    sb.from('products').select('id,name,unit,selling_price').eq('active', true).order('name'),
    sb.from('v_stock_on_hand').select('product_id,quantity_on_hand,avg_unit_cost')
  ]);
  if (cu.error || pr.error) return toast((cu.error || pr.error).message, true);
  if (!pr.data.length) return toast('Add at least one product first (Setup > Products).', true);

  openModal(`<h3>New sale</h3><form id="sf">
    <div class="grid2">
      <label>Customer<select id="sCust"><option value="">Walk-in / cash customer</option>${cu.data.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <label>Date<input type="date" id="sDate" value="${today()}" required></label>
    </div>
    <div id="rows"></div>
    <button type="button" class="btn small ghost" id="addRow">+ Add item</button>
    <p class="muted" style="font-size:12px">Cost per unit is what it cost you to produce or buy one unit. It is used to work out profit.</p>
    <div class="grid2">
      <label>Reference (optional)<input id="sRef"></label>
      <label>Notes (optional)<input id="sNotes"></label>
      <label>Payment received now (USD)<input type="number" id="sPaid" step="0.01" min="0" value="0"></label>
      <label>Payment method<select id="sMeth">${METHODS.map(m => `<option value="${m}">${cap(m)}</option>`).join('')}</select></label>
    </div>
    <h3 style="text-align:right">Total: <span id="sTotal">$0.00</span></h3>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="sSave">Save sale</button></div></form>`);

  const stock = {}; (sk.data || []).forEach(s => stock[s.product_id] = s);
  const opts = pr.data.map(p => { const s = stock[p.id];
    return `<option value="${p.id}" data-price="${p.selling_price ?? ''}" data-cost="${s && s.avg_unit_cost ? s.avg_unit_cost : ''}">${esc(p.name)} (${esc(p.unit)})${s ? ' · ' + num(s.quantity_on_hand) + ' in stock' : ''}</option>`; }).join('');
  const calc = () => {
    let t = 0;
    document.querySelectorAll('.item-row').forEach(r => {
      t += (Number($('.q', r).value) || 0) * (Number($('.p', r).value) || 0) - (Number($('.d', r).value) || 0);
    });
    $('#sTotal').textContent = money(t); return t;
  };
  const addRow = () => {
    const d = document.createElement('div'); d.className = 'item-row';
    d.innerHTML = `<label>Product<select class="pr">${opts}</select></label>
      <label>Qty<input class="q" type="number" step="0.01" min="0.01" value="1" required></label>
      <label>Unit price<input class="p" type="number" step="0.01" min="0" required></label>
      <label>Discount<input class="d" type="number" step="0.01" min="0" value="0"></label>
      <label>Cost / unit<input class="c" type="number" step="0.01" min="0" value="0"></label>
      <button type="button" class="btn small danger">✕</button>`;
    $('#rows').appendChild(d);
    const sel = $('.pr', d), setPrice = () => { const o = sel.selectedOptions[0]; $('.p', d).value = o.dataset.price || ''; $('.c', d).value = o.dataset.cost || 0; calc(); };
    sel.onchange = setPrice; setPrice();
    d.oninput = calc;
    $('button', d).onclick = () => { if (document.querySelectorAll('.item-row').length > 1) { d.remove(); calc(); } };
  };
  $('#addRow').onclick = addRow; addRow();

  $('#sf').onsubmit = async e => {
    e.preventDefault();
    const items = [...document.querySelectorAll('.item-row')].map(r => ({
      product_id: Number($('.pr', r).value), quantity: Number($('.q', r).value),
      unit_price: Number($('.p', r).value), discount: Number($('.d', r).value) || 0, unit_cost: Number($('.c', r).value) || 0
    }));
    const total = calc(), paid = Number($('#sPaid').value) || 0;
    if (items.some(i => !(i.quantity > 0) || isNaN(i.unit_price))) return toast('Check quantities and prices', true);
    if (total < 0) return toast('Discount is larger than the sale', true);
    if (paid > total + 0.005) return toast('Payment is more than the sale total', true);
    if (!$('#sCust').value && paid < total - 0.005) return toast('Credit sales need a customer selected', true);
    $('#sSave').disabled = true;

    const { data:sale, error:e1 } = await sb.from('sales').insert({
      sale_date: $('#sDate').value, customer_id: $('#sCust').value ? Number($('#sCust').value) : null,
      reference: $('#sRef').value.trim() || null, notes: $('#sNotes').value.trim() || null
    }).select('id').single();
    if (e1) { $('#sSave').disabled = false; return toast(e1.message, true); }

    const { error:e2 } = await sb.from('sale_items').insert(items.map(i => ({ ...i, sale_id: sale.id })));
    if (e2) { await sb.from('sales').delete().eq('id', sale.id); $('#sSave').disabled = false; return toast(e2.message, true); }

    if (paid > 0) {
      const { error:e3 } = await sb.from('payments').insert({ direction:'in', sale_id:sale.id, amount:paid, method:$('#sMeth').value });
      if (e3) toast('Sale saved, but the payment failed: ' + e3.message, true);
    }
    closeModal(); toast('Sale saved'); renderSales();
  };
}

let period = 'month';
function periodRange(p) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const iso = dt => dt.toISOString().slice(0, 10);
  if (p === 'month') return [iso(new Date(Date.UTC(y, m, 1))), iso(new Date(Date.UTC(y, m + 1, 1)))];
  if (p === 'year')  return [iso(new Date(Date.UTC(y, 0, 1))), iso(new Date(Date.UTC(y + 1, 0, 1)))];
  return [null, null];
}

function ageOf(dob) {
  if (!dob) return '–';
  const d = new Date(dob), n = new Date();
  let m = (n.getFullYear() - d.getFullYear()) * 12 + n.getMonth() - d.getMonth();
  if (n.getDate() < d.getDate()) m--;
  if (m < 0) return '–';
  return m < 12 ? m + ' mo' : Math.floor(m / 12) + 'y ' + (m % 12) + 'm';
}
function statusTag(s) {
  const c = s === 'active' ? '' : s === 'dead' ? 'bad' : 'sold';

}

async function lsTable() {

  const from = lsState.page * PAGE_SIZE;
  let q = sb.from('animals').select('*, loc:locations(name)', { count:'exact' }).order('tag').range(from, from + PAGE_SIZE - 1);
  if (lsState.species) q = q.eq('species', lsState.species);

  if (lsState.q) q = q.ilike('tag', '%' + lsState.q.replace(/[%_,()]/g, '') + '%');
  const { data, error, count } = await q;
  if (error) return box.innerHTML = `<p class="neg">${esc(error.message)}</p>`;
  const last = Math.min(from + PAGE_SIZE, count || 0);
  box.innerHTML = `<div class="tw"><table><thead><tr><th>Tag</th><th>Species</th><th>Breed</th><th>Sex</th><th>Age</th><th>Location</th><th>Status</th></tr></thead><tbody>
    ${data.map(a => `<tr class="click" data-id="${a.id}"><td><b>${emo(a.species)} ${esc(a.tag)}</b></td><td>${esc(cap(a.species))}</td><td>${esc(a.breed || '')}</td>
      <td>${a.sex === 'F' ? 'Female' : a.sex === 'M' ? 'Male' : ''}</td><td>${ageOf(a.date_of_birth)}</td><td>${esc(a.loc?.name || '')}</td><td>${statusTag(a.status)}</td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">No animals match. Use "Register animal" to add one.</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:10px"><span class="muted" style="flex:1">${count ? (from + 1) + '–' + last + ' of ' + count : ''}</span>
      <button class="btn small ghost" id="pgPrev" ${lsState.page === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn small ghost" id="pgNext" ${last >= (count || 0) ? 'disabled' : ''}>Next →</button></div>`;

}

/* weight chart (inline SVG) */
function weightChart(ws) {
  if (ws.length < 2) return '<p class="muted">Record at least two weights to see the growth chart.</p>';
  const W = 440, H = 180, P = 34;
  const xs = ws.map(w => new Date(w.event_date).getTime()), ys = ws.map(w => Number(w.weight_kg));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = t => x1 === x0 ? W / 2 : P + (t - x0) / (x1 - x0) * (W - 2 * P);
  const sy = v => y1 === y0 ? H / 2 : H - P - (v - y0) / (y1 - y0) * (H - 2 * P);
  const pts = ws.map((w, i) => [sx(xs[i]), sy(ys[i]), w]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight over time">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#dfe5dc"/>
    <polyline fill="none" stroke="#2f6b3a" stroke-width="2.5" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#2f6b3a"><title>${esc(p[2].event_date)}: ${num(p[2].weight_kg)} kg</title></circle>`).join('')}
    <text x="4" y="${sy(y1) + 4}" font-size="11" fill="#6b7a6d">${num(y1)} kg</text>
    <text x="4" y="${sy(y0) + 4}" font-size="11" fill="#6b7a6d">${num(y0)} kg</text>
    <text x="${P}" y="${H - 10}" font-size="11" fill="#6b7a6d">${esc(ws[0].event_date)}</text>
    <text x="${W - P}" y="${H - 10}" font-size="11" fill="#6b7a6d" text-anchor="end">${esc(ws[ws.length - 1].event_date)}</text></svg>`;
}

/* animal profile */
async function animalProfile(id) {
  const [ar, er] = await Promise.all([
    sb.from('animals').select('*, loc:locations(name)').eq('id', id).single(),
    sb.from('animal_events').select('*, loc:locations(name)').eq('animal_id', id)
      .order('event_date', { ascending:false }).order('id', { ascending:false })
  ]);
  if (ar.error) return toast(ar.error.message, true);
  if (er.error) return toast(er.error.message, true);
  const a = ar.data, ev = er.data;

  const parentIds = [a.dam_id, a.sire_id].filter(Boolean);
  const parents = {};
  if (parentIds.length) {
    const { data } = await sb.from('animals').select('id,tag').in('id', parentIds);
    (data || []).forEach(p => parents[p.id] = p.tag);
    a.dam_tag = parents[a.dam_id] || ''; a.sire_tag = parents[a.sire_id] || '';
  }

  const ws = ev.filter(e => e.event_type === 'weight').slice().reverse();
  let latest = '–', gain = '–';
  if (ws.length) {
    const first = ws[0], lastW = ws[ws.length - 1];
    latest = num(lastW.weight_kg) + ' kg';
    if (ws.length > 1) {
      const days = (new Date(lastW.event_date) - new Date(first.event_date)) / 86400000;
      const g = Number(lastW.weight_kg) - Number(first.weight_kg);
      gain = (g >= 0 ? '+' : '') + num(g) + ' kg' + (days > 0 ? ` · ${num(g / days)} kg/day` : '');
    }
  }
  const active = a.status === 'active';

  openModal(`<div class="prof-head"><div class="big">${emo(a.species)}</div>
      <div><h3>${esc(a.tag)}</h3><div class="muted">${esc(cap(a.species))}${a.breed ? ' · ' + esc(a.breed) : ''}${a.sex ? ' · ' + (a.sex === 'F' ? 'Female' : 'Male') : ''} · ${ageOf(a.date_of_birth)}</div>${statusTag(a.status)}</div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Location</div><div class="v" style="font-size:16px">${esc(a.loc?.name || '–')}</div></div>
      <div class="kpi"><div class="l">Latest weight</div><div class="v" style="font-size:16px">${latest}</div></div>
      <div class="kpi"><div class="l">Weight gain</div><div class="v" style="font-size:16px">${gain}</div></div>
      <div class="kpi"><div class="l">Acquisition cost</div><div class="v" style="font-size:16px">${money(a.acquisition_cost)}</div></div>
      <div class="kpi"><div class="l">Current value</div><div class="v" style="font-size:16px">${a.current_value == null ? '–' : money(a.current_value)}</div></div>
    </div>
    ${a.dam_tag || a.sire_tag ? `<p class="muted">Mother: ${esc(a.dam_tag || '–')} · Father: ${esc(a.sire_tag || '–')}</p>` : ''}
    ${a.notes ? `<p class="muted">${esc(a.notes)}</p>` : ''}
    <div class="card"><b>Weight over time</b>${weightChart(ws)}</div>
    <div class="row-actions">
      ${can('animals') && active ? '<button class="btn" id="pAddEv">+ Add event</button>' : ''}
      ${can('sales') && active ? '<button class="btn" id="pSell" style="background:#b26a00">Sell this animal</button>' : ''}
      ${can('animals') ? '<button class="btn ghost" id="pEdit">Edit details</button>' : ''}
      <button class="btn ghost" onclick="closeModal()">Close</button></div>
    <h4>History</h4>
    <div class="timeline">${ev.map(e => {
      const m = EV[e.event_type] || ['•', cap(e.event_type)];
      const bits = [];
      if (e.event_type === 'weight') bits.push(num(e.weight_kg) + ' kg');
      if (e.event_type === 'movement' && e.loc?.name) bits.push('to ' + e.loc.name);
      if (e.event_type === 'valuation') bits.push('value ' + money(e.cost));
      else if (Number(e.cost) > 0) bits.push('cost ' + money(e.cost));
      if (e.details) bits.push(e.details);
      return `<div class="tl"><span class="ic">${m[0]}</span><div><b>${m[1]}</b> <span class="muted">· ${esc(e.event_date)}</span>${bits.length ? `<div class="muted">${esc(bits.join(' · '))}</div>` : ''}</div></div>`;
    }).join('') || '<p class="muted">No history yet.</p>'}</div>`);
  if ($('#pAddEv')) $('#pAddEv').onclick = () => addEvent(a);
  if ($('#pSell')) $('#pSell').onclick = () => sellAnimal(a);
  if ($('#pEdit')) $('#pEdit').onclick = () => openAnimalForm(a);
}

      date_of_birth:v('a_dob') || null, source:v('a_src') || null, acquired_on:v('a_acq') || null,
      acquisition_cost: v('a_cost') === '' ? 0 : Number(v('a_cost')),
      current_location_id: v('a_loc') ? Number(v('a_loc')) : null, dam_id:dam, sire_id:sire, notes:v('a_notes') || null };

    if (a) {

      $('#aSave').disabled = false;

      toast('Saved'); refreshLivestock(); return animalProfile(a.id);
    }

    if (rec.source === 'purchased' && rec.acquired_on) evs.push({ event_type:'purchase', event_date:rec.acquired_on, cost:rec.acquisition_cost });

  };

/* sell an animal (creates a normal sale linked to this animal) */
async function sellAnimal(a) {
  const [cu, pr] = await Promise.all([

  if (cu.error || pr.error) return toast((cu.error || pr.error).message, true);
  if (!pr.data.length) return toast('First add a Livestock product under Setup > Products, e.g. "Live Cattle" with unit "animal".', true);
  const guess = pr.data.find(p => p.name.toLowerCase().includes(String(a.species).toLowerCase())) || pr.data[0];

  openModal(`<h3>Sell ${esc(a.tag)}</h3><form id="sellF"><div class="grid2">
      <label>Customer<select id="s_cust"><option value="">Walk-in / cash customer</option>${cu.data.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>

      <label>Product<select id="s_prod">${pr.data.map(p => `<option value="${p.id}" data-price="${p.selling_price ?? ''}" ${p.id === guess.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>

      <label>What this animal cost you (USD)<input type="number" id="s_cost" step="0.01" min="0" value="${esc(a.acquisition_cost ?? 0)}"></label>
      <label>Payment received now (USD)<input type="number" id="s_paid" step="0.01" min="0" value="0"></label>
      <label>Payment method<select id="s_meth">${METHODS.map(m => `<option value="${m}">${cap(m)}</option>`).join('')}</select></label>
    </div>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="sSell">Confirm sale</button></div></form>`);
  const setPrice = () => { $('#s_price').value = $('#s_prod').selectedOptions[0].dataset.price || ''; };
  $('#s_prod').onchange = setPrice; setPrice();

  $('#sellF').onsubmit = async e => {
    e.preventDefault();
    const price = Number($('#s_price').value), paid = Number($('#s_paid').value) || 0;
    if (paid > price + 0.005) return toast('Payment is more than the price', true);
    if (!$('#s_cust').value && paid < price - 0.005) return toast('Credit sales need a customer selected', true);
    $('#sSell').disabled = true;
    const { data:sale, error:e1 } = await sb.from('sales').insert({
      sale_date:$('#s_date').value, customer_id:$('#s_cust').value ? Number($('#s_cust').value) : null
    }).select('id').single();
    if (e1) { $('#sSell').disabled = false; return toast(e1.message, true); }
    const { error:e2 } = await sb.from('sale_items').insert({
      sale_id:sale.id, product_id:Number($('#s_prod').value), animal_id:a.id, quantity:1,
      unit_price:price, unit_cost:Number($('#s_cost').value) || 0
    });
    if (e2) { await sb.from('sales').delete().eq('id', sale.id); $('#sSell').disabled = false; return toast(e2.message, true); }
    if (paid > 0) {
      const { error:e3 } = await sb.from('payments').insert({ direction:'in', sale_id:sale.id, amount:paid, method:$('#s_meth').value });
      if (e3) toast('Sale saved, but the payment failed: ' + e3.message, true);
    }
    toast('Animal sold'); refreshLivestock(); animalProfile(a.id);
  };
}
/* ============================================================
   9. INTERACTIVE NETWORK BACKGROUND (login page and dashboard banner)
      Drifting nodes joined by lines. Farm icons float as larger nodes,
      drift toward the cursor, and click adds a new node.
   ============================================================ */
function startNetwork(canvas, opts = {}) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const EMOJIS = ['🐄','🐐','🐑','🐔','🥛','🥚','🥩','🐖','🌾'];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const mouse = { x:-9999, y:-9999 };
  let W = 0, H = 0, nodes = [];

  const make = (x, y, icon) => ({ x, y, vx:(Math.random() - .5) * .45, vy:(Math.random() - .5) * .45, r:1.8 + Math.random() * 2.2, icon });
  function size() {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }
  function build() {
    const n = Math.max(14, Math.min(70, Math.round(W * H / (opts.density || 14000))));
    nodes = [];
    for (let i = 0; i < n; i++) nodes.push(make(Math.random() * W, Math.random() * H, i < (opts.icons || 0) ? EMOJIS[i % EMOJIS.length] : null));
  }
  const rel = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const onMove = e => { [mouse.x, mouse.y] = rel(e); };
  const onDown = e => { const [x, y] = rel(e); if (nodes.length < 90) nodes.push(make(x, y, null)); };
  const onResize = () => { if (size()) build(); };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('resize', onResize);
  canvas.addEventListener('pointerdown', onDown);
  const cleanup = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('resize', onResize); };

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const a of nodes) {
      if (!reduce) {
        a.x += a.vx; a.y += a.vy;
        const dx = mouse.x - a.x, dy = mouse.y - a.y, d = Math.hypot(dx, dy);
        if (d < 150 && d > 1) { a.x += dx / d * 0.6; a.y += dy / d * 0.6; }
      }
      if (a.x < 0 || a.x > W) { a.vx *= -1; a.x = Math.max(0, Math.min(W, a.x)); }
      if (a.y < 0 || a.y > H) { a.vy *= -1; a.y = Math.max(0, Math.min(H, a.y)); }
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 125) { ctx.strokeStyle = `rgba(255,255,255,${((1 - d / 125) * 0.35).toFixed(3)})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (dm < 170) { ctx.strokeStyle = `rgba(255,255,255,${((1 - dm / 170) * 0.55).toFixed(3)})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
    }
    for (const a of nodes) {
      if (a.icon) {
        const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y), s = dm < 70 ? 30 : 22;
        ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(a.x, a.y, s * 0.75, 0, 6.2832); ctx.fill();
        ctx.font = `${s}px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(a.icon, a.x, a.y + 1);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
      }
    }
  }
  function frame() {
    if (!canvas.isConnected) return cleanup();
    if (canvas.getClientRects().length) {
      if (!W && size()) build();
      if (W) draw();
    }
    requestAnimationFrame(frame);
  }
  if (size()) build();
  if (reduce) { draw(); return; }
  frame();
}

/* numbers count up when the dashboard loads */
function animateNumbers(root) {
  if (!root || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  root.querySelectorAll('.kpi .v, .tile .c').forEach(el => {
    const txt = el.textContent.trim();
    const isMoney = /^-?\$[\d,]+(\.\d+)?$/.test(txt), isInt = /^\d+$/.test(txt);
    if (!isMoney && !isInt) return;
    const target = parseFloat(txt.replace(/[^0-9.\-]/g, ''));
    if (!isFinite(target) || target === 0) return;
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - k, 3));
      el.textContent = isMoney ? money(v) : String(Math.round(v));
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = txt;
    };
    requestAnimationFrame(step);
  });
}

      <label>Notes (optional)<input id="pNotes"></label>

    </div>

    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="pSave">Save purchase</button></div></form>`);

  const opts = pr.data.map(p => `<option value="${p.id}">${esc(p.name)} (${esc(p.unit)})${p.track_stock ? ' · stock' : ''}</option>`).join('');
  const calc = () => {
    let t = 0;
    document.querySelectorAll('#prows .item-row').forEach(r => { t += (Number($('.q', r).value) || 0) * (Number($('.c', r).value) || 0); });
    $('#pTotal').textContent = money(t); return t;
  };
  const addRow = () => {
    const d = document.createElement('div'); d.className = 'item-row p4';
    d.innerHTML = `<label>Product<select class="pr">${opts}</select></label>
      <label>Qty<input class="q" type="number" step="0.01" min="0.01" value="1" required></label>
      <label>Unit cost<input class="c" type="number" step="0.01" min="0" required></label>
      <button type="button" class="btn small danger">✕</button>`;
    $('#prows').appendChild(d); d.oninput = calc;
    $('button', d).onclick = () => { if (document.querySelectorAll('#prows .item-row').length > 1) { d.remove(); calc(); } };
  };
  $('#addPRow').onclick = addRow; addRow();

  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const items = [...document.querySelectorAll('#prows .item-row')].map(r => ({
      product_id:Number($('.pr', r).value), quantity:Number($('.q', r).value), unit_cost:Number($('.c', r).value)
    }));
    const total = calc(), paid = Number($('#pPaid').value) || 0;
    if (items.some(i => !(i.quantity > 0) || isNaN(i.unit_cost))) return toast('Check quantities and costs', true);
    if (paid > total + 0.005) return toast('Payment is more than the purchase total', true);
    if (!$('#pSup').value && paid < total - 0.005) return toast('Buying on credit needs a supplier selected', true);
    $('#pSave').disabled = true;

    const { data:pu, error:e1 } = await sb.from('purchases').insert({
      purchase_date:$('#pDate').value, supplier_id:$('#pSup').value ? Number($('#pSup').value) : null,
      reference:$('#pRefN').value.trim() || null, notes:$('#pNotes').value.trim() || null
    }).select('id').single();
    if (e1) { $('#pSave').disabled = false; return toast(e1.message, true); }

    const { error:e2 } = await sb.from('purchase_items').insert(items.map(i => ({ ...i, purchase_id:pu.id })));
    if (e2) { await sb.from('purchases').delete().eq('id', pu.id); $('#pSave').disabled = false; return toast(e2.message, true); }

    if (paid > 0) {
      const { error:e3 } = await sb.from('payments').insert({ direction:'out', purchase_id:pu.id, amount:paid, method:$('#pMethN').value });
      if (e3) toast('Purchase saved, but the payment failed: ' + e3.message, true);
    }
    closeModal(); toast('Purchase saved'); renderPurchases();
  };
}

        <td class="n"><b>${num(b.s.remaining)}</b></td><td class="n">${num(b.s.feed_kg)}</td><td class="n ${Number(b.s.profit) < 0 ? 'neg' : 'pos'}">${money(b.s.profit)}</td>

async function batchProfile(id) {
  const [br, sr, er, ir] = await Promise.all([
    sb.from('poultry_batches').select('*, loc:locations(name)').eq('id', id).single(),
    sb.from('v_poultry_batch_summary').select('*').eq('batch_id', id).single(),
    sb.from('poultry_events').select('*').eq('batch_id', id).order('event_date', { ascending:false }).order('id', { ascending:false }),
    sb.from('sale_items').select('sale_id, quantity, unit_price, line_total, sales!inner(sale_date, customers(name))').eq('batch_id', id)
  ]);
  const err = br.error || sr.error || er.error || ir.error;
  if (err) return toast(err.message, true);
  const b = br.data, s = sr.data, rem = Number(s.remaining), cost = Number(b.acquisition_cost) + Number(s.running_cost);
  const sold = Number(s.sold), avg = sold ? Number(s.revenue) / sold : 0, active = b.status === 'active';
  const hist = [
    ...er.data.map(e => {
      const m = PEV[e.event_type] || ['•', cap(e.event_type)], bits = [];
      if (e.event_type === 'feed') bits.push(num(e.feed_kg) + ' kg'); else if (Number(e.quantity) > 0) bits.push(num(e.quantity) + ' birds');
      if (Number(e.cost) > 0) bits.push('cost ' + money(e.cost));
      if (e.notes) bits.push(e.notes);
      return { d:e.event_date, k:e.id, ic:m[0], t:m[1], x:bits.join(' · ') };
    }),
    ...ir.data.map(i => ({ d:i.sales.sale_date, k:0, ic:'🏷️', t:'Sold ' + num(i.quantity) + ' birds',
      x:`${money(i.line_total)} · ${i.sales.customers?.name || 'Walk-in'} · sale #${i.sale_id}` }))
  ].sort((p, q) => String(q.d).localeCompare(String(p.d)) || q.k - p.k);

  openModal(`<div class="prof-head"><div class="big">🐔</div><div><h3>${esc(b.batch_code)}</h3>
      <div class="muted">${esc(cap(b.poultry_type))}${b.breed ? ' · ' + esc(b.breed) : ''} · started ${esc(b.acquired_on)}${b.loc?.name ? ' · ' + esc(b.loc.name) : ''}</div>
      <span class="tag ${active ? '' : 'sold'}">${esc(cap(b.status))}</span></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Remaining</div><div class="v">${num(rem)} <span class="muted" style="font-size:13px">of ${num(b.quantity_initial)}</span></div></div>
      <div class="kpi"><div class="l">Deaths</div><div class="v">${num(s.mortality)} <span class="muted" style="font-size:13px">${num(s.mortality_rate_pct)}%</span></div></div>
      <div class="kpi"><div class="l">Sold</div><div class="v">${num(sold)}</div></div>
      <div class="kpi"><div class="l">Average price</div><div class="v">${sold ? money(avg) : '–'}</div></div>
      <div class="kpi"><div class="l">Feed used</div><div class="v">${num(s.feed_kg)} kg</div></div>
      <div class="kpi"><div class="l">Revenue</div><div class="v">${money(s.revenue)}</div></div>
      <div class="kpi"><div class="l">Cost so far</div><div class="v">${money(cost)}</div></div>
      <div class="kpi"><div class="l">Profit so far</div><div class="v ${Number(s.profit) < 0 ? 'neg' : 'pos'}">${money(s.profit)}</div></div></div>
    <div class="barfill" style="width:${(rem / Number(b.quantity_initial) * 100).toFixed(1)}%;margin-bottom:12px" title="Share of birds still on the farm"></div>
    <div class="row-actions">
      ${can('poultry_events') && active ? '<button class="btn" id="bEv">+ Record event</button>' : ''}
      ${can('sales') && active && rem > 0 ? '<button class="btn" id="bSell" style="background:#b26a00">Sell birds</button>' : ''}
      ${can('poultry_batches') ? `<button class="btn ghost" id="bClose">${active ? 'Close batch' : 'Reopen batch'}</button>` : ''}
      <button class="btn ghost" onclick="closeModal()">Close</button></div>
    <h4>History</h4>
    <div class="timeline">${hist.map(h => `<div class="tl"><span class="ic">${h.ic}</span><div><b>${esc(h.t)}</b> <span class="muted">· ${esc(h.d)}</span>${h.x ? `<div class="muted">${esc(h.x)}</div>` : ''}</div></div>`).join('') || '<p class="muted">No history yet.</p>'}</div>`);
  if ($('#bEv')) $('#bEv').onclick = () => batchEvent(b, s);
  if ($('#bSell')) $('#bSell').onclick = () => sellBirds(b, s);
  if ($('#bClose')) $('#bClose').onclick = async () => {
    if (active && rem > 0 && !confirm(`${rem} birds are still recorded in this batch. Close it anyway?`)) return;
    const { error } = await sb.from('poultry_batches').update({ status: active ? 'closed' : 'active' }).eq('id', b.id);
    if (error) return toast(error.message, true);
    toast(active ? 'Batch closed' : 'Batch reopened'); refreshPoultry(); batchProfile(b.id);
  };
}

function batchEvent(b, s) {
  const rem = Number(s.remaining);
  openModal(`<h3>Record event · ${esc(b.batch_code)}</h3><form id="bf"><div class="grid2">
      <label>What happened<select id="b_type"><option value="mortality">💀 Deaths</option><option value="feed">🌽 Feed given</option><option value="cull">✂️ Culled / used at home</option><option value="other">📝 Note</option></select></label>
      <label>Date<input type="date" id="b_date" value="${today()}" required></label>
      <label id="b_ql">Number of birds (${num(rem)} remaining)<input type="number" id="b_q" min="1" step="1" max="${rem}"></label>
      <label id="b_fl">Feed (kg)<input type="number" id="b_f" min="0.01" step="0.01"></label>
      <label id="b_cl">Feed cost (USD, optional)<input type="number" id="b_c" min="0" step="0.01" value="0"></label>
    </div><label>Notes<input id="b_n"></label>
    <p class="muted" style="font-size:12px">Tip: feed taken from stock is better recorded under Stock > Stock movement > Use / issue, linking the batch there. It then reduces stock and adds the feed to this batch at the same time.</p>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="bSave">Save event</button></div></form>`);
  const sync = () => {
    const t = $('#b_type').value;
    $('#b_ql').style.display = (t === 'mortality' || t === 'cull') ? '' : 'none';
    $('#b_fl').style.display = t === 'feed' ? '' : 'none';
    $('#b_cl').style.display = t === 'feed' ? '' : 'none';
  };
  $('#b_type').onchange = sync; sync();
  $('#bf').onsubmit = async e => {
    e.preventDefault();
    const t = $('#b_type').value;
    const rec = { batch_id:b.id, event_type:t, event_date:$('#b_date').value, notes:$('#b_n').value.trim() || null };
    if (t === 'mortality' || t === 'cull') {
      rec.quantity = Number($('#b_q').value);
      if (!(rec.quantity >= 1)) return toast('Enter the number of birds', true);
      if (rec.quantity > rem) return toast(`Only ${rem} birds remain in this batch`, true);
    }
    if (t === 'feed') {
      rec.feed_kg = Number($('#b_f').value); rec.cost = Number($('#b_c').value) || 0;
      if (!(rec.feed_kg > 0)) return toast('Enter the feed in kg', true);
    }
    if (t === 'other' && !rec.notes) return toast('Write a short note', true);
    $('#bSave').disabled = true;
    const { error } = await sb.from('poultry_events').insert(rec);
    if (error) { $('#bSave').disabled = false; return toast(error.message, true); }
    toast('Saved'); refreshPoultry(); batchProfile(b.id);
  };
}

async function sellBirds(b, s) {
  const [cu, pr] = await Promise.all([
    sb.from('customers').select('id,name').eq('active', true).order('name'),
    sb.from('products').select('id,name,unit,selling_price').eq('business_line', 'poultry').eq('active', true).order('name')
  ]);
  if (cu.error || pr.error) return toast((cu.error || pr.error).message, true);
  if (!pr.data.length) return toast('First add a Poultry product under Setup > Products, e.g. "Live broiler" with unit "bird".', true);
  const rem = Number(s.remaining), survivors = Number(b.quantity_initial) - Number(s.mortality);
  const perBird = survivors > 0 ? (Number(b.acquisition_cost) + Number(s.running_cost)) / survivors : 0;
  openModal(`<h3>Sell birds · ${esc(b.batch_code)}</h3><form id="sbf"><div class="grid2">
      <label>Customer<select id="y_cust"><option value="">Walk-in / cash customer</option>${cu.data.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <label>Date<input type="date" id="y_date" value="${today()}" required></label>
      <label>Product<select id="y_prod">${pr.data.map(p => `<option value="${p.id}" data-price="${p.selling_price ?? ''}">${esc(p.name)} (${esc(p.unit)})</option>`).join('')}</select></label>
      <label>Number of birds (${num(rem)} remaining)<input type="number" id="y_q" min="1" max="${rem}" step="1" value="1" required></label>
      <label>Price per bird (USD)<input type="number" id="y_p" min="0" step="0.01" required></label>
      <label>Cost per bird (USD)<input type="number" id="y_c" min="0" step="0.01" value="${perBird.toFixed(2)}"></label>
      <label>Payment received now (USD)<input type="number" id="y_paid" min="0" step="0.01" value="0"></label>
      <label>Payment method<select id="y_meth">${METHODS.map(m => `<option value="${m}">${cap(m)}</option>`).join('')}</select></label>
    </div><h3 style="text-align:right">Total: <span id="y_tot">$0.00</span></h3>
    <p class="muted" style="font-size:12px">Cost per bird is suggested from this batch's costs so far. Change it if you know better.</p>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="ySave">Confirm sale</button></div></form>`);
  const calc = () => { const t = (Number($('#y_q').value) || 0) * (Number($('#y_p').value) || 0); $('#y_tot').textContent = money(t); return t; };
  const setPrice = () => { $('#y_p').value = $('#y_prod').selectedOptions[0].dataset.price || ''; calc(); };
  $('#y_prod').onchange = setPrice; $('#y_q').oninput = calc; $('#y_p').oninput = calc; setPrice();
  $('#sbf').onsubmit = async e => {
    e.preventDefault();
    const q = Number($('#y_q').value), total = calc(), paid = Number($('#y_paid').value) || 0;
    if (q > rem) return toast(`Only ${rem} birds remain in this batch`, true);
    if (paid > total + 0.005) return toast('Payment is more than the sale total', true);
    if (!$('#y_cust').value && paid < total - 0.005) return toast('Credit sales need a customer selected', true);
    $('#ySave').disabled = true;
    const { data:sale, error:e1 } = await sb.from('sales').insert({ sale_date:$('#y_date').value, customer_id:$('#y_cust').value ? Number($('#y_cust').value) : null }).select('id').single();
    if (e1) { $('#ySave').disabled = false; return toast(e1.message, true); }
    const { error:e2 } = await sb.from('sale_items').insert({ sale_id:sale.id, product_id:Number($('#y_prod').value), batch_id:b.id, quantity:q, unit_price:Number($('#y_p').value), unit_cost:Number($('#y_c').value) || 0 });
    if (e2) { await sb.from('sales').delete().eq('id', sale.id); $('#ySave').disabled = false; return toast(e2.message, true); }
    if (paid > 0) {
      const { error:e3 } = await sb.from('payments').insert({ direction:'in', sale_id:sale.id, amount:paid, method:$('#y_meth').value });
      if (e3) toast('Sale saved, but the payment failed: ' + e3.message, true);
    }
    toast('Birds sold'); refreshPoultry(); batchProfile(b.id);
  };
}

const PL = { milk:['🥛', 'Milk'], eggs:['🥚', 'Eggs'], meat:['🥩', 'Meat'], other:['📦', 'Other'] };
const prodState = { line:'', period:'month' };

async function renderProduction() {
  $('#main').innerHTML = `<div class="bar"><h2>Production</h2>
    <select id="pl" style="max-width:150px"><option value="">All types</option>${Object.keys(PL).map(k => `<option value="${k}">${PL[k][0]} ${PL[k][1]}</option>`).join('')}</select>
    <select id="pp" style="max-width:140px"><option value="month">This month</option><option value="year">This year</option><option value="all">All time</option></select>
    ${can('production_records') ? '<button class="btn" id="newPr">+ Record production</button>' : ''}</div>
    <div id="pk"></div><div id="tbl"><p class="muted">Loading…</p></div>`;
  $('#pl').value = prodState.line; $('#pp').value = prodState.period;
  if ($('#newPr')) $('#newPr').onclick = newProduction;
  const load = async () => {
    const [from, to] = periodRange(prodState.period);
    let q = sb.from('production_records').select('*, products(name,unit), animals(tag), poultry_batches(batch_code), loc:locations(name)')
      .order('production_date', { ascending:false }).order('id', { ascending:false }).limit(1000);
    if (prodState.line) q = q.eq('business_line', prodState.line);
    if (from) q = q.gte('production_date', from);
    if (to) q = q.lt('production_date', to);
    const { data, error } = await q;
    if (error) return $('#tbl').innerHTML = `<p class="neg">${esc(error.message)}</p>`;
    const by = {};
    data.forEach(r => {
      const o = by[r.business_line] = by[r.business_line] || { q:0, lost:0, cost:0, carcass:0, unit:'' };
      o.q += Number(r.quantity); o.lost += Number(r.quantity_lost || 0); o.carcass += Number(r.carcass_weight_kg || 0);
      o.cost += Number(r.input_cost || 0) + Number(r.processing_cost || 0); o.unit = o.unit || r.products?.unit || '';
    });
    const keys = Object.keys(by);
    $('#pk').innerHTML = keys.length ? `<div class="card"><b>Summary</b><div class="tw" style="margin-top:8px"><table><thead><tr><th>Type</th><th class="n">Produced</th><th class="n">Lost</th><th class="n">Cost per unit</th><th class="n">Yield</th></tr></thead><tbody>
      ${keys.map(k => { const o = by[k], m = PL[k] || ['📦', cap(k)];
        return `<tr><td>${m[0]} ${m[1]}</td><td class="n">${num(o.q)} ${esc(o.unit)}</td><td class="n">${num(o.lost)}</td><td class="n">${o.q && o.cost ? money(o.cost / o.q) : '–'}</td><td class="n">${k === 'meat' && o.carcass ? num(o.q / o.carcass * 100) + '% of carcass' : '–'}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';
    $('#tbl').innerHTML = `<div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Product</th><th>From</th><th class="n">Quantity</th><th class="n">Lost</th><th class="n">Cost / unit</th><th>Location</th></tr></thead><tbody>
      ${data.map(r => { const m = PL[r.business_line] || ['📦', cap(r.business_line)], uc = Number(r.quantity) ? (Number(r.input_cost || 0) + Number(r.processing_cost || 0)) / Number(r.quantity) : 0;
        return `<tr title="${esc(r.notes || '')}"><td>${esc(r.production_date)}</td><td>${m[0]} ${m[1]}</td><td>${esc(r.products?.name)}</td><td>${esc(r.animals?.tag || r.poultry_batches?.batch_code || '')}</td>
        <td class="n">${num(r.quantity)} ${esc(r.products?.unit)}</td><td class="n">${num(r.quantity_lost)}</td><td class="n">${uc ? money(uc) : '–'}</td><td>${esc(r.loc?.name || '')}</td></tr>`; }).join('')
        || '<tr><td colspan="8" class="muted">Nothing recorded for this selection. Use "Record production" to add milk, eggs or meat.</td></tr>'}</tbody></table></div>`;
  };
  $('#pl').onchange = e => { prodState.line = e.target.value; load(); };
  $('#pp').onchange = e => { prodState.period = e.target.value; load(); };
  load();
}

    hint();
  };
  $('#pr_line').onchange = sync; $('#pr_prod').onchange = hint;
  $('#pr_an').onchange = () => { if ($('#pr_line').value === 'meat') $('#pr_ic').value = $('#pr_an').selectedOptions[0]?.dataset.cost || 0; };
  sync();
  $('#prf').onsubmit = async e => {
    e.preventDefault();
    const L = $('#pr_line').value, o = $('#pr_prod').selectedOptions[0];
    if (!o) return toast('Add a product for this type first (Setup > Products)', true);
    const q = Number($('#pr_q').value), lost = L === 'meat' ? 0 : Number($('#pr_lost').value) || 0, cw = L === 'meat' ? Number($('#pr_cw').value) : null;
    if (lost > q) return toast('Lost quantity cannot be more than the quantity produced', true);
    if (L === 'meat') {
      if (!$('#pr_an').value) return toast('Choose the animal that was slaughtered', true);
      if (!(cw > 0)) return toast('Enter the carcass weight', true);
      if (q > cw) return toast('Finished meat cannot be more than the carcass weight', true);
      if (!confirm('Record the slaughter of ' + $('#pr_an').selectedOptions[0].textContent + '? The animal will be closed as slaughtered.')) return;
    }
    $('#prSave').disabled = true;
    const { error } = await sb.from('production_records').insert({
      production_date:$('#pr_date').value, business_line:L === 'other' ? o.dataset.line : L, product_id:Number(o.value),
      animal_id:(L === 'milk' || L === 'meat') && $('#pr_an').value ? Number($('#pr_an').value) : null,
      batch_id:L === 'eggs' && $('#pr_bt').value ? Number($('#pr_bt').value) : null,
      location_id:$('#pr_loc').value ? Number($('#pr_loc').value) : null,
      quantity:q, quantity_lost:lost, carcass_weight_kg:cw, input_cost:Number($('#pr_ic').value) || 0,
      processing_cost:L === 'meat' ? Number($('#pr_pc').value) || 0 : 0, notes:$('#pr_n').value.trim() || null
    });
    if (error) { $('#prSave').disabled = false; return toast(error.message, true); }
    closeModal(); toast('Production recorded'); renderProduction();
  };
}

async function newMovement(rows) {
  if (!rows.length) return toast('No stock items yet. Tick "Track stock" on a product first (Setup > Products).', true);
  const { data:bt } = await sb.from('poultry_batches').select('id,batch_code').eq('status', 'active').order('batch_code');
  const by = {}; rows.forEach(r => by[r.product_id] = r);
  openModal(`<h3>Stock movement</h3><form id="mvf"><div class="grid2">
      <label>Product<select id="m_prod">${rows.map(r => `<option value="${r.product_id}">${esc(r.name)} (${num(r.quantity_on_hand)} ${esc(r.unit)})</option>`).join('')}</select></label>
      <label>What happened<select id="m_type"><option value="issue">Use / issue (e.g. feed given, medicine used)</option><option value="loss">Loss / damage / spoiled</option><option value="adjustment">Adjustment (count correction or opening stock)</option></select></label>
      <label id="m_ql"><span id="m_qt">Quantity used</span><input type="number" id="m_q" step="0.01" required></label>
      <label>Date<input type="date" id="m_date" value="${today()}" required></label>
      <label id="m_ul">Cost per unit (USD)<input type="number" id="m_uc" step="0.01" min="0" value="0"></label>
      <label id="m_bl">For poultry batch (optional)<select id="m_bt"><option value="">–</option>${(bt || []).map(b => `<option value="${b.id}">${esc(b.batch_code)}</option>`).join('')}</select></label>
    </div><label>Notes (optional)<input id="m_n"></label>
    <p class="muted" style="font-size:12px" id="m_help"></p>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="mSave">Save</button></div></form>`);
  const sync = () => {
    const t = $('#m_type').value, r = by[$('#m_prod').value];
    $('#m_ul').style.display = t === 'adjustment' ? '' : 'none';
    $('#m_bl').style.display = t === 'issue' ? '' : 'none';
    $('#m_qt').textContent = t === 'adjustment' ? `Quantity to add (use a minus sign to remove) · ${r.unit}` : `Quantity (${r.unit})`;
    $('#m_uc').value = r.avg_unit_cost || 0;
    $('#m_help').textContent = t === 'adjustment' ? 'Use this to enter opening stock when you start, or to correct a stock count. Give the cost per unit so the stock is valued correctly.'
      : t === 'issue' && r.unit === 'kg' ?'If you pick a poultry batch, the feed is also added to that batch automatically.' : '';
  };
  $('#m_type').onchange = sync; $('#m_prod').onchange = sync; sync();
  $('#mvf').onsubmit = async e => {
    e.preventDefault();
    const t = $('#m_type').value, r = by[$('#m_prod').value], q = Number($('#m_q').value);
    if (!q) return toast('Enter a quantity', true);
    const qty = t === 'adjustment' ? q : -Math.abs(q);
    if (qty < 0 && -qty > Number(r.quantity_on_hand)) return toast(`Only ${num(r.quantity_on_hand)} ${r.unit} in stock`, true);
    const uc = t === 'adjustment' && qty > 0 ? Number($('#m_uc').value) || 0 : Number(r.avg_unit_cost || 0);
    $('#mSave').disabled = true;
    const { error } = await sb.from('stock_movements').insert({ product_id:r.product_id, movement_date:$('#m_date').value, movement_type:t, quantity:qty, unit_cost:uc, notes:$('#m_n').value.trim() || null });
    if (error) { $('#mSave').disabled = false; return toast(error.message, true); }
    if (t === 'issue' && $('#m_bt').value) {
      const { error:e2 } = await sb.from('poultry_events').insert({ batch_id:Number($('#m_bt').value), event_type:'feed', event_date:$('#m_date').value,
        feed_kg:r.unit === 'kg' ? Math.abs(qty) : 0, cost:Math.abs(qty) * uc, notes:'From stock: ' + r.name });
      if (e2) toast('Stock updated, but adding it to the batch failed: ' + e2.message, true);
    }
    closeModal(); toast('Saved'); renderStock();
  };
}
